name: Fabric JAR Derle

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 25 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 9.5.1 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Eski sınıf kartlarını temizle
        run: |
          rm -f src/main/resources/assets/skinpowers/textures/gui/cards/time.png
          rm -f src/main/resources/assets/skinpowers/textures/gui/cards/nature.png
          rm -f src/main/resources/data/skinpowers/enchantment/kok_bagi.json
          rm -f src/main/resources/data/skinpowers/enchantment/can_filizi.json
          rm -f src/main/resources/data/skinpowers/enchantment/orman_sicrayisi.json
          rm -f src/main/resources/data/skinpowers/enchantment/dikenli_savunma.json
          # Vampir denemesi kaldırıldı; dosya kalırsa SAND geçişi derlemeyi kırar
          rm -f src/main/java/com/yagiz/skinpowers/VampirePowerSystem.java

      - name: JSON ve proje yapısını denetle
        continue-on-error: true
        run: python3 tools/verify_project.py

      - name: Modu derle (indirme hatasında otomatik yeniden dene)
        shell: bash
        run: |
          set +e

          for deneme in 1 2 3; do
            echo "=============================================="
            echo "Gradle derleme denemesi: ${deneme}/3"
            echo "=============================================="

            if [ "$deneme" -eq 1 ]; then
              gradle clean build --stacktrace --warning-mode all
            else
              echo "Eksik veya yarım inmiş Mod Menu önbelleği temizleniyor..."
              rm -rf "$HOME/.gradle/caches/modules-2/files-2.1/com.terraformersmc/modmenu"
              rm -rf "$HOME/.gradle/caches/modules-2/metadata-2.*/descriptors/com.terraformersmc/modmenu" 2>/dev/null || true

              gradle clean build --refresh-dependencies --stacktrace --warning-mode all
            fi

            sonuc=$?
            if [ "$sonuc" -eq 0 ]; then
              echo "Derleme ${deneme}. denemede başarıyla tamamlandı."
              exit 0
            fi

            if [ "$deneme" -lt 3 ]; then
              echo "Derleme başarısız oldu. Geçici Maven/bağlantı hatası ihtimaline karşı yeniden denenecek."
              sleep $((deneme * 15))
            fi
          done

          echo "Derleme üç denemede de tamamlanamadı. Son hata gerçek derleme hatası veya devam eden sunucu sorunu olabilir."
          exit 1

      - name: Derlenen JAR dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: skinpowers-1.3.0-jar
          path: build/libs/skinpowers-1.3.0.jar
          if-no-files-found: error
